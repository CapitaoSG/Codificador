name: Pipeline Codificador

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      mensagem:
        description: "Mensagem para codificar"
        required: false
        default: ""
      tipo:
        description: "Tipo de codificação"
        type: choice
        required: true
        default: cesar
        options:
          - cesar
          - base64

jobs:
  codificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar codificador
        env:
          MENSAGEM: ${{ inputs.mensagem }}
          TIPO: ${{ inputs.tipo }}
        run: python scripts/codificar.py

      - name: Guardar resultado
        uses: actions/upload-artifact@v4
        with:
          name: mensagem-codificada
          path: saida/
          
  decodificar:
    needs: codificar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar resultado da codificação
        uses: actions/download-artifact@v4
        with:
          name: mensagem-codificada
          path: saida/

      - name: Rodar decodificador
        run: python scripts/decodificar.py

      - name: Guardar mensagem decodificada
        uses: actions/upload-artifact@v4
        with:
          name: mensagem-decodificada
          path: saida/mensagem_decodificada.txt  